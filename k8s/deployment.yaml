apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-eco-api
  labels:
    app: cloud-eco-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-eco-api
  template:
    metadata:
      labels:
        app: cloud-eco-api
    spec:
      containers:
        - name: cloud-eco-api
          image: ajayramanathan/cloud-eco-api:latest
          imagePullPolicy: Always
          env:
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: NUMEXPR_NUM_THREADS
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "750m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
